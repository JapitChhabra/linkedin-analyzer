services:
  - type: web
    name: linkedin-analyzer-backend
    env: python
    branch: main
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python -m playwright install --with-deps
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FRONTEND_URL
        value: https://easy-recruit-ai.netlify.app
